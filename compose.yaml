services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      PYTHONPATH: /src

    ports:
      - "8000:8000"

    volumes:
      - ./src:/src
      - ./main.py:/main.py
      - ./PDF:/PDF

    command:
      - uv
      - run
      - uvicorn
      - main:main
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
